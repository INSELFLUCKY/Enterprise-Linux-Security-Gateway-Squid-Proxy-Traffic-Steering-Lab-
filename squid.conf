# =========================================================================
# 1. NETWORK & LISTEN PORT SETUP
# =========================================================================
# Squid default listening port
http_port 3128

# Set visible hostname for logs and diagnostic headers
visible_hostname linux-security-gateway.local

# =========================================================================
# 2. DEFINE ACCESS CONTROL LISTS (ACLs)
# =========================================================================
# Define standard Safe Ports (prevent proxy misuse for non-web protocols)
acl Safe_ports port 80          # http
acl Safe_ports port 443         # https
acl SSL_ports  port 443         # https

# Block requests to non-safe ports
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

# Define local client networks allowed to use this proxy
acl local_network src 192.168.1.0/24   # Example Home/Office Subnet
acl local_network src 10.100.0.0/16    # Internal LAN Subnet
acl localhost src 127.0.0.1/32

# Define Blocked Domains List (Path to plain text file containing blocked sites)
acl blocked_sites dstdomain "/etc/squid/blocked_domains.txt"

# =========================================================================
# 3. HTTP ACCESS RULES (Order Matters!)
# =========================================================================
# Always allow localhost
http_access allow localhost

# Rule 1: DENY access to any domain listed in blocked_domains.txt
http_access deny blocked_sites

# Rule 2: ALLOW access from verified internal local networks
http_access allow local_network

# Rule 3: DENY all other traffic by default (Default Deny / Zero Trust principle)
http_access deny all

# =========================================================================
# 4. LOGGING CONFIGURATION
# =========================================================================
# Enable standard access logging for CLI analysis (tail -f /var/log/squid/access.log)
access_log daemon:/var/log/squid/access.log squid

# Hide local client internal IP address in outgoing HTTP headers (Privacy/Security)
forwarded_for off
